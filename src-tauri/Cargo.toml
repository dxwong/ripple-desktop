[package]
name = "ripple-desktop"
version = "0.2.0"
description = "Ripple Desktop - AI Programming Assistant"
authors = ["Ripple"]
edition = "2021"

[lib]
name = "ripple_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"
ureq = "2"
